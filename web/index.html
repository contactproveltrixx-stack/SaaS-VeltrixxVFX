<!DOCTYPE html>
<html lang="fr" data-mode="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>*,*::before,*::after{box-sizing:border-box}
:root{
  --font-ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:var(--font-ui);
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
  /* Accent : la braise du coucher de soleil sur l'Estérel. Utilisé pour la tête de lecture et le mois en cours, presque rien d'autre. */
  --accent:#E8603C;
  --ok:#4CC38A; --warn:#E3A23B; --bad:#E5484D; --info:#5B9BD5;
  --r-xl:20px; --r-lg:20px; --r-md:12px; --r-sm:10px; --r-xs:6px;
  --ease:cubic-bezier(.22,1,.36,1); --ease-io:cubic-bezier(.65,0,.25,1);
  --blur:26px;
}
/* Rampe neutre légèrement chaude (le sable), trois rôles de texte, hairlines à 8-10 % */
:root,[data-mode="night"]{
  --glass:rgba(18,17,15,.38); --glass-2:rgba(24,23,21,.62); --glass-3:rgba(255,255,255,.06);
  --edge:rgba(255,255,255,.14);
  --ink:#EFECE6; --ink-2:#B3AEA5; --ink-3:#8F8A81; --ink-4:rgba(239,236,230,.28); --ink-inv:#161513;
  --line:rgba(239,236,230,.1); --field:rgba(255,255,255,.06); --field-hover:rgba(255,255,255,.1);
  --shadow:0 16px 40px -16px rgba(0,0,0,.5);
  --chip:rgba(239,236,230,.08);
  --scrim:rgba(5,7,13,.42);
  color-scheme:dark;
}
[data-mode="day"]{
  --glass:rgba(253,251,247,.36); --glass-2:rgba(253,251,247,.7); --glass-3:rgba(255,255,255,.45);
  --edge:rgba(255,255,255,.7);
  --ink:#1A1916; --ink-2:#4F4B45; --ink-3:#6B665E; --ink-4:rgba(26,25,22,.28); --ink-inv:#FDFBF7;
  --line:rgba(26,25,22,.09); --field:rgba(255,255,255,.55); --field-hover:rgba(255,255,255,.75);
  --shadow:0 12px 32px -16px rgba(26,25,22,.25);
  --chip:rgba(26,25,22,.06);
  --scrim:rgba(253,251,247,.3);
  --bad:#DC2626; --ok:#16A34A;
  color-scheme:light;
}
html,body{margin:0;height:100%;background:#04060c;color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#scene{position:fixed;inset:0;display:block;z-index:0}
#veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 60%,rgba(0,0,0,.22))}

/* ---------- Verre liquide (demandé) : flou, hairline, un seul reflet en haut, ombre neutre ---------- */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);backdrop-filter:blur(var(--blur)) saturate(160%);
  border-radius:var(--r-lg);box-shadow:var(--shadow),inset 0 1px 0 var(--edge),inset 0 0 0 1px var(--line);isolation:isolate;transition:background .5s var(--ease)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:-1;
  background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.06) 30%,rgba(255,255,255,0) 70%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.refract .glass.lens{-webkit-backdrop-filter:url(#lg-refract) blur(16px) saturate(170%);backdrop-filter:url(#lg-refract) blur(16px) saturate(170%)}

/* ---------- Lancement : une timeline de montage ---------- */
#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;cursor:pointer}
#splash .half{position:absolute;left:0;right:0;height:50.5%;background:#05070d;transition:transform .9s var(--ease-io)}
#splash .half.top{top:0}#splash .half.bot{bottom:0}
#splash.cut .half.top{transform:translateY(-101%)}#splash.cut .half.bot{transform:translateY(101%)}
#splash .seam{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--accent);opacity:0;z-index:3}
#splash .stage{position:relative;width:min(560px,84vw);height:96px;z-index:2}
#splash .track{position:absolute;left:0;right:0;height:32px;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);transform:scaleX(0)}
#splash .track.v{top:12px}#splash .track.a{top:52px}
#splash .clip{position:absolute;height:24px;border-radius:6px;opacity:0;filter:saturate(.55) brightness(.7);transition:filter .2s var(--ease)}
#splash .clip.lit{filter:none}
#splash .clip.wave{background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 1px,transparent 1px 4px)!important}
#splash .ph{position:absolute;top:-20px;bottom:-12px;width:2px;background:var(--accent);left:0;opacity:0;z-index:4}
#splash .ph::before{content:"";position:absolute;top:-1px;left:-6px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--accent)}
#splash .tc{position:absolute;top:-44px;left:0;transform:translateX(-50%);font:500 12px/1 var(--font-mono);color:#EFECE6;opacity:0;white-space:nowrap;z-index:4}
#splash .mark{position:absolute;inset:0;display:grid;place-items:center;z-index:5;pointer-events:none}
#splash .mark b{font:500 clamp(48px,8vw,72px)/1 var(--font-ui);color:#EFECE6;letter-spacing:-.03em;opacity:0}
#splash .mark small{display:block;text-align:center;margin-top:12px;font:400 14px/1 var(--font-ui);color:#8F8A81;opacity:0}
#splash .skip{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font:400 12px var(--font-ui);color:rgba(255,255,255,.32)}

/* ---------- Connexion ---------- */
#auth{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;opacity:0;transition:opacity .5s var(--ease)}
#auth.show{opacity:1}
#auth[hidden]{display:none}
.auth-card{width:min(400px,100%);padding:32px 32px 24px;border-radius:var(--r-xl);transform:translateY(12px);transition:transform .5s var(--ease),opacity .4s var(--ease)}
#auth.show .auth-card{transform:none}
#auth.leaving .auth-card{transform:translateY(-8px);opacity:0}
.auth-mark{font:500 32px/1 var(--font-ui);letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
.auth-sub{margin:12px 0 28px;color:var(--ink-3);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.auth-sub .dot{width:3px;height:3px;border-radius:50%;background:currentColor}
.field{display:block;margin-bottom:16px}
.field>span{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:8px}
.input,.field input,.field select,.field textarea{width:100%;height:40px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--field);outline:none;transition:background .15s var(--ease),border-color .15s var(--ease)}
.field textarea{height:auto;min-height:88px;padding:8px 12px;resize:vertical}
.input:hover,.field input:hover,.field select:hover,.field textarea:hover{background:var(--field-hover)}
.input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink-3);background:var(--field-hover)}
.check{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink-2);margin:4px 0 20px;cursor:pointer;user-select:none}
.check input{appearance:none;width:32px;height:20px;border-radius:10px;background:var(--chip);position:relative;cursor:pointer;transition:background .15s var(--ease);flex:none;border:1px solid var(--line);margin:0}
.check input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--ink-2);transition:transform .18s var(--ease),background .15s}
.check input:checked{background:var(--ink)}
.check input:checked::after{transform:translateX(12px);background:var(--ink-inv)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--glass-3);color:var(--ink);font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .15s var(--ease),transform .12s var(--ease),opacity .15s;text-decoration:none}
.btn:hover{background:var(--field-hover)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);border-color:transparent;color:var(--ink-inv);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.btn.primary:hover{opacity:.88;background:var(--ink)}
.btn.block{width:100%;height:44px;font-size:14px}
.btn[disabled]{opacity:.5;pointer-events:none}
.auth-err{min-height:20px;margin:12px 0 0;font-size:13px;color:var(--bad);text-align:center}
.shake{animation:shake .4s var(--ease)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.auth-foot{margin-top:16px;text-align:center;font-size:12px;color:var(--ink-3)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;opacity:.7;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mark-ph{width:16px;height:24px;position:relative;flex:none}
.mark-ph::before{content:"";position:absolute;left:7px;top:6px;bottom:0;width:2px;background:var(--accent)}
.mark-ph::after{content:"";position:absolute;left:1px;top:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--accent)}
#app{position:fixed;inset:0;z-index:10}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="veil"></div>

<div id="splash" aria-hidden="true">
  <div class="half top"></div><div class="half bot"></div><div class="seam"></div>
  <div class="stage">
    <div class="track v"></div><div class="track a"></div>
    <div class="ph"></div><div class="tc">00:00:00:00</div>
  </div>
  <div class="mark"><div><b>Croisette</b><small>studio de montage</small></div></div>
  <div class="skip">Cliquer pour passer</div>
</div>

<div id="auth" hidden>
  <form class="glass lens auth-card" id="auth-form" autocomplete="on">
    <div class="auth-mark"><span class="mark-ph" aria-hidden="true"></span>Croisette</div>
    <div class="auth-sub" id="auth-wx"></div>
    <label class="field"><span>Identifiant</span><input id="auth-id" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
    <label class="field"><span>Mot de passe</span><input id="auth-pw" type="password" name="password" autocomplete="current-password" required></label>
    <label class="check"><input type="checkbox" id="auth-remember"><span>Rester connecté sur cet appareil (30 jours)</span></label>
    <button class="btn primary block" id="auth-go" type="submit">Ouvrir le studio</button>
    <p class="auth-err" id="auth-err" role="alert"></p>
    <div class="auth-foot">Accès privé, données chiffrées</div>
  </form>
</div>

<div id="app"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="lg-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="n"/>
    <feGaussianBlur in="n" stdDeviation="2" result="nb"/>
    <feDisplacementMap in="SourceGraphic" in2="nb" scale="38" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

      }
    }
    if (P.flashA > 0) { g.fillStyle = `rgba(255,220,170,${P.flashA})`; g.fillRect(0, 0, W, horizon); P.flashA -= .01 * dt; }
    g.lineWidth = 1.6;
    for (let i = P.sparks.length - 1; i >= 0; i--) {
      const s = P.sparks[i]; s.px = s.x; s.py = s.y; s.vx *= .985; s.vy = s.vy * .985 + .04 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= s.d * dt;
      if (s.life <= 0) { P.sparks.splice(i, 1); continue; }
      g.strokeStyle = rgb(hex(s.c), s.life); g.beginPath(); g.moveTo(s.px, s.py); g.lineTo(s.x, s.y); g.stroke();
      if (s.y < horizon) { g.fillStyle = rgb(hex(s.c), s.life * .25); g.fillRect(s.x, horizon + (horizon - s.y) * .25 + 4, 2, 2); }
    }
    g.restore();
  }
}

function makeGrain() {
  grainTile = document.createElement('canvas'); grainTile.width = grainTile.height = 128;
  const x = grainTile.getContext('2d'), id = x.createImageData(128, 128);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255 | 0; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  x.putImageData(id, 0, 0); grainPat = g.createPattern(grainTile, 'repeat');
}

const Scene = {
  start(canvas) {
    cv = canvas; g = cv.getContext('2d', { alpha: false });
    computeContext(true); resize(); makeGrain();
    window.addEventListener('resize', () => { resize(); paletteDirty = true; });
    cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
    fetchWeather();
    setInterval(() => computeContext(), 60e3);
    setInterval(fetchWeather, 15 * 60e3);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) computeContext(); });
  },
  get ctx() { return ctx || computeContext(); },
  get prefs() { return Object.assign({}, prefs); },
  setPrefs(p) {
    const placeChanged = p.lat != null && (p.lat !== prefs.lat || p.lon !== prefs.lon);
    Object.assign(prefs, p); localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
    computeContext(true);
    if (placeChanged) fetchWeather();
  },
  refreshWeather: fetchWeather,
  kindOf: wxKind,
  onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); },
  labels: { EVENT_LABEL, SEASON_LABEL, WX_LABEL }
};
window.Scene = Scene;
})();
</script>
<script>/* Croisette — chargeur : animation d'ouverture, connexion, déchiffrement de l'application. */
(() => {
'use strict';
const $ = s => document.querySelector(s);
const VAULT = JSON.parse(document.getElementById('vault').textContent);
const te = new TextEncoder(), td = new TextDecoder();
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = id => String(id).trim().toLowerCase().normalize('NFC');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const N = window.croisetteNative || null;
const root = document.documentElement;
if (N) root.classList.add('native', 'os-' + (N.platform || 'win'));
const ua = navigator.userAgent;
const chromium = /Chrome\//.test(ua) && !/Edg\/|OPR\//.test(ua) || !!N;
const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) root.classList.add('standalone');

/* Scène de fond */
Scene.start($('#scene'));
if (chromium && !ios && Scene.prefs.refract !== false) root.classList.add('refract');

/* ---------- Animation d'ouverture : une timeline de montage ---------- */
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
let skipped = false;
async function playSplash() {
  const sp = $('#splash');
  const finish = async () => {
    sp.classList.add('cut');
    $('#splash .stage').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' });
    $('#splash .mark').animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(-10px)' }], { duration: 500, fill: 'forwards' });
    await wait(900); sp.remove();
  };
  if (reduced) { await wait(250); return finish(); }
  sp.addEventListener('click', () => { skipped = true; }, { once: true });
  document.addEventListener('keydown', () => { skipped = true; }, { once: true });
  const stage = $('#splash .stage');
  const clips = [
    { t: 'v', l: 2, w: 19, c: '#D9B98C' }, { t: 'v', l: 22.5, w: 27, c: '#3C7FB8' }, { t: 'v', l: 51, w: 15, c: '#E5484D' }, { t: 'v', l: 67.5, w: 30, c: '#7E8F5A' },
    { t: 'a', l: 2, w: 46, c: '#2FA597', wave: 1 }, { t: 'a', l: 49.5, w: 48, c: '#C98A3E', wave: 1 }
  ];
  const els = clips.map((c, i) => {
    const d = document.createElement('div');
    d.className = 'clip' + (c.wave ? ' wave' : '');
    d.style.cssText = `left:${c.l}%;width:${c.w}%;top:${c.t === 'v' ? 16 : 58}px;background:${c.c}`;
    stage.appendChild(d); return { el: d, ...c, i };
  });
  const tracks = [...document.querySelectorAll('#splash .track')];
  tracks.forEach((t, i) => t.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 520, delay: i * 90, easing: 'cubic-bezier(.6,0,.2,1)', fill: 'forwards' }));
  els.forEach((c, i) => c.el.animate([
    { opacity: 0, transform: `translateX(${(i % 2 ? 1 : -1) * 90}px)` },
    { opacity: 1, transform: 'translateX(0)' }
  ], { duration: 520, delay: 260 + i * 85, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' }));
  await wait(900);
  if (skipped) return finish();
  const ph = $('#splash .ph'), tc = $('#splash .tc');
  ph.style.opacity = 1; tc.style.opacity = 1;
  const dur = 1150, t0 = performance.now();
  await new Promise(res => {
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      const e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      const pct = e * 100;
      ph.style.left = pct + '%'; tc.style.left = pct + '%';
      const frames = Math.round(e * 62);
      tc.textContent = `00:00:${String(Math.floor(frames / 25)).padStart(2, '0')}:${String(frames % 25).padStart(2, '0')}`;
      els.forEach(c => c.el.classList.toggle('lit', pct >= c.l));
      if (p < 1 && !skipped) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
  if (skipped) return finish();
  stage.animate([{ transform: 'scaleY(1)', opacity: 1 }, { transform: 'scaleY(.04)', opacity: .9 }], { duration: 260, easing: 'cubic-bezier(.7,0,.3,1)', fill: 'forwards' });
  $('#splash .seam').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, delay: 160, fill: 'forwards' });
  await wait(220);
  $('#splash .mark b').animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 650, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' });
  $('#splash .mark small').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, delay: 250, fill: 'forwards' });
  await wait(skipped ? 100 : 850);
  return finish();
}

/* ---------- Cryptographie ---------- */
async function derive(id, pw, salt, it) {
  const base = await crypto.subtle.importKey('raw', te.encode(norm(id) + '\u0000' + String(pw).normalize('NFC')), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: it }, base, 512));
  return { kek: bits.slice(0, 32), dk: bits.slice(32) };
}
const aesKey = (raw, usages) => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, usages);
async function gunzip(u8) {
  const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unlock(id, pw) {
  const { kek, dk } = await derive(id, pw, b64d(VAULT.salt), VAULT.it);
  const kekKey = await aesKey(kek, ['decrypt']);
  const pk = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(VAULT.wiv) }, kekKey, b64d(VAULT.wpk)));
  let dkRaw = dk;
  if (VAULT.wdk) dkRaw = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(VAULT.wdiv) }, kekKey, b64d(VAULT.wdk)));
  return { pk: await aesKey(pk, ['decrypt']), dk: await aesKey(dkRaw, ['encrypt', 'decrypt']), id: norm(id) };
}

/* Session mémorisée (clés non exportables dans IndexedDB) */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('croisette', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function kv(op, key, val) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', op === 'get' ? 'readonly' : 'readwrite');
    const st = tx.objectStore('kv');
    const rq = op === 'get' ? st.get(key) : op === 'del' ? st.delete(key) : st.put(val, key);
    rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
  });
}
const REMEMBER_DAYS = 30;

async function boot(keys, remember) {
  const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(VAULT.piv) }, keys.pk, b64d(VAULT.ct));
  const P = JSON.parse(td.decode(await gunzip(new Uint8Array(gz))));
  if (remember) await kv('put', 'session', { pk: keys.pk, dk: keys.dk, id: keys.id, exp: Date.now() + REMEMBER_DAYS * 864e5, build: VAULT.build }).catch(() => {});
  const st = document.createElement('style'); st.textContent = P.css; document.head.appendChild(st);
  window.__CROISETTE__ = {
    dk: keys.dk, user: keys.id, build: VAULT.build, version: VAULT.version, native: N,
    async lock() { await kv('del', 'session').catch(() => {}); location.reload(); },
    async rememberStatus() { const s = await kv('get', 'session').catch(() => null); return s ? { exp: s.exp } : null; },
    async remember(on) { if (on) await kv('put', 'session', { pk: keys.pk, dk: keys.dk, id: keys.id, exp: Date.now() + REMEMBER_DAYS * 864e5, build: VAULT.build }); else await kv('del', 'session'); }
  };
  const auth = $('#auth');
  auth.classList.add('leaving');
  await wait(380);
  auth.remove();
  const app = document.getElementById('app');
  app.innerHTML = P.html;
  const sc = document.createElement('script'); sc.textContent = P.js; document.body.appendChild(sc);
}

/* ---------- Écran de connexion ---------- */
function weatherLine() {
  const c = Scene.ctx;
  const d = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  const parts = [d.charAt(0).toUpperCase() + d.slice(1)];
  if (c.temp != null) parts.push(`${c.temp}° · ${c.wxLabel.toLowerCase()}`);
  parts.push(c.place);
  if (c.eventLabel) parts.push(c.eventLabel);
  $('#auth-wx').innerHTML = parts.map(p => `<span>${p}</span>`).join('<i class="dot"></i>');
}

async function showAuth() {
  const auth = $('#auth');
  auth.hidden = false; weatherLine(); Scene.onChange(weatherLine);
  requestAnimationFrame(() => auth.classList.add('show'));
  const form = $('#auth-form'), btn = $('#auth-go'), err = $('#auth-err');
  setTimeout(() => { const i = $('#auth-id'); if (!i.value) i.focus(); else $('#auth-pw').focus(); }, 500);
  try { const last = localStorage.getItem('croisette.lastId'); if (last) $('#auth-id').value = last; } catch (e) {}
  if (N) $('#auth-remember').checked = true;
  form.addEventListener('submit', async e => {
    e.preventDefault();
    err.textContent = ''; btn.disabled = true; const label = btn.innerHTML; btn.innerHTML = '<i class="spin"></i>';
    const id = $('#auth-id').value, pw = $('#auth-pw').value;
    try {
      const keys = await unlock(id, pw);
      try { localStorage.setItem('croisette.lastId', id.trim()); } catch (e) {}
      await boot(keys, $('#auth-remember').checked);
    } catch (e2) {
      console.warn(e2);
      btn.disabled = false; btn.innerHTML = label;
      err.textContent = 'Identifiant ou mot de passe incorrect.';
      const card = $('.auth-card'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      $('#auth-pw').select();
    }
  });
}

async function tryRemembered() {
  try {
    const s = await kv('get', 'session');
    if (!s || s.exp < Date.now() || s.build !== VAULT.build) { if (s) await kv('del', 'session'); return false; }
    await boot({ pk: s.pk, dk: s.dk, id: s.id }, false);
    return true;
  } catch (e) { return false; }
}

(async () => {
  const splash = playSplash();
  await splash;
  if (!(await tryRemembered())) showAuth();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
</script>
